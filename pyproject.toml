[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-canarytrap"
version = "1.3.0"
description = "Educational deterministic decoy-access detection prototype for MCP servers"
requires-python = ">=3.11"
dependencies = ["mcp[cli]>=2,<3", "fastapi>=0.115", "uvicorn>=0.30", "httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
canarytrap-demo = "mcp_canarytrap.demo:main"
canarytrap-api = "mcp_canarytrap.api:run"
canarytrap-stdio-proxy = "mcp_canarytrap.stdio_proxy:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
