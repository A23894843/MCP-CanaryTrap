# Explanation: Packaging/test configuration entry (configuration value): see the value on the following line to understand the setting.
[build-system]
# Explanation: Packaging/test configuration entry (requires): see the value on the following line to understand the setting.
requires = ["setuptools>=68"]
# Explanation: Packaging/test configuration entry (build-backend): see the value on the following line to understand the setting.
build-backend = "setuptools.build_meta"

# Explanation: Packaging/test configuration entry (configuration value): see the value on the following line to understand the setting.
[project]
