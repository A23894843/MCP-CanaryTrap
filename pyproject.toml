# Explanation: Packaging/test configuration entry (configuration value): see the value on the following line to understand the setting.
[tool.pytest.ini_options]
# Explanation: Packaging/test configuration entry (testpaths): see the value on the following line to understand the setting.
testpaths = ["tests"]
# Explanation: Packaging/test configuration entry (pythonpath): see the value on the following line to understand the setting.
