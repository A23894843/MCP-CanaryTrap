services:
  - type: web
    name: mcp-canarytrap
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: CANARYTRAP_CVE_TOKEN
        generateValue: true
      - key: CANARYTRAP_ALLOWED_HOSTS
        value: mcp-canarytrap.onrender.com
      - key: CANARYTRAP_ALLOWED_ORIGINS
        value: https://mcp-canarytrap.onrender.com
